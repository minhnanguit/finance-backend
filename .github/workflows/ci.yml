name: backend-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # needed only by the release job to attach the contract

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Format, unit + architecture tests
        run: ./gradlew spotlessCheck test

      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest

      - name: Boot jar
        run: ./gradlew bootJar

      - name: Publish API contract as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: api/openapi.yaml

      - name: Publish module documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: build/spring-modulith-docs
          if-no-files-found: ignore

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests

  # Tagging vX.Y.Z publishes the contract the mobile repo pins to (see api/README in finance-mobile).
  release-contract:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: api/openapi.yaml
          generate_release_notes: true
