name: backend-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Mặc định chỉ đọc; job nào cần hơn thì tự khai (images, deploy, release-contract).
permissions:
  contents: read

# Push thêm commit vào PR ⇒ huỷ lần chạy cũ. Push main / tag thì không huỷ (mỗi ref một nhóm riêng).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  keycloak-theme:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keycloak-theme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: keycloak-theme/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build-keycloak-theme
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keycloak-theme-playwright-report
          path: keycloak-theme/playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: finance-keycloak-theme
          path: keycloak-theme/dist_keycloak/*.jar

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Format, unit + architecture tests
        run: ./gradlew spotlessCheck test

      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest

      - name: Boot jar
        run: ./gradlew bootJar

      - name: Publish API contract as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: api/openapi.yaml

      - name: Publish module documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: build/spring-modulith-docs
          if-no-files-found: ignore

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests

  # ---------- Chỉ khi đẩy tag v*: CD (docs/CICD-PLAN.md) ----------

  # Build image ARM64 ngay trên runner ARM (không giả lập QEMU) rồi đẩy lên GHCR, tag = tên tag git + sha-<commit>.
  # Không có `latest`: server luôn chạy đúng một phiên bản ghi trong deploy/.release.
  images:
    needs: [keycloak-theme, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: finance-backend
            context: .
          - name: finance-keycloak
            context: keycloak-theme
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
          flavor: latest=false
          # Gắn package vào repo này ⇒ GITHUB_TOKEN của repo đọc được lúc deploy.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: read

  # Tagging vX.Y.Z publishes the contract the mobile repo pins to (see api/README in finance-mobile).
  release-contract:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: api/openapi.yaml
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
