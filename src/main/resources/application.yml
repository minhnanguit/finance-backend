spring:
  application:
    name: finance-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DB_USER:finance}
    password: ${DB_PASSWORD:finance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:finance}
    password: ${RABBITMQ_PASSWORD:finance}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        acknowledge-mode: auto # container acks after the listener succeeds (not broker auto-ack)
        prefetch: 20
        default-requeue-rejected: false # failures go to the DLX -> <queue>.parked
        observation-enabled: true
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2.0
          max-attempts: 5
          max-interval: 30s
  modulith:
    events:
      externalization:
        enabled: true
      completion-mode: archive
      jdbc:
        schema-initialization:
          enabled: false # schema is owned by Flyway (V1)
    republish-outstanding-events-on-restart: true

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, modulith
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html

app:
  security:
    # Keycloak là IdP duy nhất. App này chỉ verify token, không issue token.
    # issuer-uri là giá trị nằm TRONG token; ở local nó là địa chỉ emulator thấy được,
    # còn process này fetch key qua jwk-set-uri trên localhost. Hai giá trị cố ý khác nhau.
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://10.0.2.2:8081/realms/finance}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/finance/protocol/openid-connect/certs}
    audience: ${KEYCLOAK_AUDIENCE:finance-api}
  identity:
    subject-cache-ttl: 10m
    subject-cache-size: 10000
  # Giới hạn theo endpoint (ADR-006 B4). Thêm endpoint = thêm dòng, không sửa code.
  request-limits:
    rate-limit-enabled: true
    rate-limits:
      - name: sync-push
        method: POST
        path: /api/v1/sync/push
        limit: 60
        window: 1m
      - name: sync-pull
        method: GET
        path: /api/v1/sync/pull
        limit: 120
        window: 1m
    body-limits:
      - method: POST
        path: /api/v1/sync/push
        max-size: 256KB
  sync:
    op-log-retention: 30d
    op-log-purge-cron: "0 30 3 * * *"
  idempotency:
    ttl: 24h
    in-progress-ttl: 30s
    protected-path-prefixes:
      - /api/
    max-body-bytes: 1048576

logging:
  level:
    org.springframework.modulith: INFO
