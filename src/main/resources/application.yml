spring:
  application:
    name: finance-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/finance}
    username: ${DB_USER:finance}
    password: ${DB_PASSWORD:finance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:finance}
    password: ${RABBITMQ_PASSWORD:finance}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        acknowledge-mode: auto # container acks after the listener succeeds (not broker auto-ack)
        prefetch: 20
        default-requeue-rejected: false # failures go to the DLX -> <queue>.parked
        observation-enabled: true
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2.0
          max-attempts: 5
          max-interval: 30s
  modulith:
    events:
      externalization:
        enabled: true
      completion-mode: archive
      jdbc:
        schema-initialization:
          enabled: false # schema is owned by Flyway (V1)
    republish-outstanding-events-on-restart: true

server:
  port: ${SERVER_PORT:18473}
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, modulith
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html

app:
  security:
    # Keycloak là IdP duy nhất. App này chỉ verify token, không issue token.
    # issuer-uri là giá trị nằm TRONG token; ở local nó là địa chỉ emulator thấy được,
    # còn process này fetch key qua jwk-set-uri trên localhost. Hai giá trị cố ý khác nhau.
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://10.0.2.2:8082/realms/finance}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8082/realms/finance/protocol/openid-connect/certs}
    audience: ${KEYCLOAK_AUDIENCE:finance-api}
  identity:
    subject-cache-ttl: 10m
    subject-cache-size: 10000
    # Mỗi instance hỏi lại "tài khoản đã xoá chưa" sau chừng này (ADR-008 A6).
    account-status-cache-ttl: 30s
    deletion:
      # Từ lúc user yêu cầu xoá tới lúc các module xoá thật dữ liệu. Phải >= account-status-cache-ttl.
      purge-delay: 10m
      finalize-interval: 1m
      # Job xoá tài khoản Keycloak (hàng đợi bền users.idp_removed_at, thử lại tới khi xong).
      idp-removal-interval: 15s
    # Client finance-backend (service account, realm-management/manage-users) để xoá tài khoản Keycloak.
    keycloak-admin:
      enabled: ${KEYCLOAK_ADMIN_ENABLED:true}
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8082}
      realm: finance
      client-id: finance-backend
      # Quyền manage-users nên KHÔNG có giá trị mặc định trong code: local thì `make up` sinh ngẫu nhiên vào
      # deploy/.env và `make run` truyền vào đây; production lấy từ secret manager.
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  # Giới hạn theo endpoint (ADR-006 B4). Thêm endpoint = thêm dòng, không sửa code.
  request-limits:
    rate-limit-enabled: true
    rate-limits:
      - name: sync-push
        method: POST
        path: /api/v1/sync/push
        limit: 60
        window: 1m
      - name: sync-pull
        method: GET
        path: /api/v1/sync/pull
        limit: 120
        window: 1m
      - name: account-deletion
        method: DELETE
        path: /api/v1/me
        limit: 5
        window: 1m
    body-limits:
      - method: POST
        path: /api/v1/sync/push
        max-size: 256KB
  sync:
    op-log-retention: 30d
    op-log-purge-cron: "0 30 3 * * *"
    # Tombstone giữ 90 ngày rồi xoá thật; máy giữ cursor cũ hơn nhận 410 sync.cursor_expired (ADR-008 T1–T5).
    tombstone-retention: 90d
    tombstone-purge-cron: "0 45 3 * * *"
  # Event đã gửi (archive) và dấu chống trùng của consumer: xoá sau 30 ngày, vì archive giữ cả payload có
  # dữ liệu cá nhân (email trong identity.user.registered) — ADR-008.
  messaging:
    retention: 30d
    cleanup-cron: "0 15 4 * * *"
  idempotency:
    ttl: 24h
    in-progress-ttl: 30s
    protected-path-prefixes:
      - /api/
    max-body-bytes: 1048576

logging:
  level:
    org.springframework.modulith: INFO
