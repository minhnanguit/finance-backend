spring:
  application:
    name: finance-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DB_USER:finance}
    password: ${DB_PASSWORD:finance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:finance}
    password: ${RABBITMQ_PASSWORD:finance}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        acknowledge-mode: auto        # container acks after the listener succeeds (not broker auto-ack)
        prefetch: 20
        default-requeue-rejected: false   # failures go to the DLX -> <queue>.parked
        observation-enabled: true
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2.0
          max-attempts: 5
          max-interval: 30s
  modulith:
    events:
      externalization:
        enabled: true
      completion-mode: archive
      jdbc:
        schema-initialization:
          enabled: false            # schema is owned by Flyway (V1)
    republish-outstanding-events-on-restart: true

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, modulith
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}

springdoc:
  api-docs:
    enabled: false                  # the contract is authored, not derived from code
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html

app:
  security:
    jwt:
      issuer: finance-backend
      access-token-ttl: 15m
      private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
      public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  identity:
    refresh-token-ttl: 30d
  idempotency:
    ttl: 24h
    in-progress-ttl: 30s
    protected-path-prefixes:
      - /api/
    max-body-bytes: 1048576

logging:
  level:
    org.springframework.modulith: INFO
