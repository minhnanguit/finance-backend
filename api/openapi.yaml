openapi: 3.0.3
info:
  title: Finance API
  version: 2.0.0
  description: |
    API contract của finance-backend, là single source of truth: backend generate server interface,
    app mobile generate client từ file này.

    Authentication
    - Token do Keycloak issue (Authorization Code + PKCE). API này không có endpoint login,
      register hay refresh token — tất cả diễn ra ở Keycloak (ADR-004).
    - Gửi access token qua `Authorization: Bearer <token>`. Claim `aud` phải chứa `finance-api`.

    Quy ước
    - Mọi write endpoint (POST / PUT / PATCH) bắt buộc header `Idempotency-Key` (UUID). Gửi lại cùng key
      và cùng payload thì nhận lại response cũ; khác payload thì 422.
    - Error theo RFC 7807 `application/problem+json`, kèm `code` ổn định, machine-readable.
    - Tiền không bao giờ là float: integer theo minor units + currency code ISO-4217.

    Breaking changes so với 1.0.0
    - Xoá `/api/v1/auth/register`, `/login`, `/refresh`, `/logout` cùng các schema đi kèm.
    - `UserProfile.id` là internal id, không phải `sub` của Keycloak.
servers:
  - url: http://localhost:8080
    description: Môi trường local
tags:
  - name: me
    description: Current user
# Chỉ khai http bearer. KHÔNG thêm scheme `openIdConnect`: generator Kotlin multiplatform 7.14 sinh code
# sai cú pháp cho scheme đó (`mapOf(, ...`), làm gãy build của finance-mobile.
security:
  - bearerAuth: []
paths:
  /api/v1/me:
    get:
      tags: [me]
      operationId: getCurrentUser
      summary: Profile của user đang login
      description: Lần gọi đầu tiên với một account Keycloak mới sẽ tự provision local account.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token do Keycloak issue cho client `finance-mobile`.
        Discovery (local): http://localhost:8081/realms/finance/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID do client generate, unique cho mỗi thao tác. Khi retry thì gửi lại y nguyên.
      schema:
        type: string
        format: uuid
  schemas:
    UserProfile:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Internal id, là key của mọi business data. Không phải `sub` của Keycloak.
        email:
          type: string
          format: email
          description: Bản copy từ Keycloak, sync trễ tối đa vài phút sau khi đổi.
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
          description: Thời điểm local account được tạo (lần đầu gọi API), không phải lúc register trên Keycloak.
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 7807 Problem Details, thêm `code` ổn định, machine-readable
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          description: Error code ổn định, ví dụ `auth.unauthenticated`
          example: auth.unauthenticated
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    BadRequest:
      description: Request malformed hoặc không pass validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Thiếu token, token expired, hoặc sai signature / issuer / audience
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Resource đã tồn tại
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Dùng lại Idempotency-Key với payload khác
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
