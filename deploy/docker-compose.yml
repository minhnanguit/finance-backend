services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Tạo database `keycloak` riêng. CHỈ chạy khi volume còn trống -> `make reset` hoặc `make kc-db`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: finance
      RABBITMQ_DEFAULT_PASS: finance
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI  http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # QUAN TRỌNG: issuer nằm trong token nên hostname phải CỐ ĐỊNH ngay từ dev.
      # 10.0.2.2 là host loopback nhìn từ Android emulator -> token được issue ra hợp lệ cho cả app lẫn backend.
      KC_HOSTNAME: http://10.0.2.2:8081
      # Cho phép backend chạy trên host gọi backchannel qua localhost:8081 mà không lệch hostname.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # 10.0.2.2 chỉ routable TỪ TRONG emulator. Không có dòng này thì Admin Console mở
      # trên máy Mac sẽ bị redirect sang 10.0.2.2 và treo. Admin dùng hostname localhost riêng.
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"     # console + OIDC endpoints  http://localhost:8081
    volumes:
      - ./keycloak/realm-finance.json:/opt/keycloak/data/import/realm-finance.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Fake SMTP cho dev: Keycloak gửi mail verify / reset password vào đây.
  mailpit:
    image: axllent/mailpit:v1.31.2
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"    # SMTP
      - "8025:8025"    # web UI  http://localhost:8025

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
